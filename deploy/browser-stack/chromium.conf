; ============================================================================
; neko Chromium supervisord override — REFERENCE COPY, NOT AUTHORITATIVE.
;
; ⚠️  The neko baseline drifts between versions. DO NOT trust this file blindly.
;     Regenerate it from the exact image you pinned in compose.yml, then apply
;     only the two deltas below:
;
;       docker run --rm --entrypoint cat \
;         ghcr.io/m1k1o/neko/chromium:<YOUR_PINNED_TAG> \
;         /etc/neko/supervisord/chromium.conf > chromium.conf
;
;     (Confirm the in-image path too — it has moved between neko releases,
;      e.g. /etc/neko/supervisord/chromium.conf vs /etc/neko/chromium.conf.)
;
; Deltas applied to the stock launch command (see below):
;   + --remote-debugging-port=9222   → enables CDP (bound to 127.0.0.1; the
;                                       socat sidecar in compose.yml re-exposes it)
;   + --remote-allow-origins=*       → required on Chromium M113+ to accept CDP
;                                       connections proxied from a non-localhost origin
;   - --bwsi                         → REMOVED: "browse without sign-in" blocks
;                                       persistent Google/logged-in profiles
;   - --disable-file-system          → REMOVED: needed for downloads/uploads
; ============================================================================

[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --start-maximized
  --force-dark-mode
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --remote-debugging-port=9222
  --remote-allow-origins=*
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
